    description: "Strong creative interest, low-income family wanting a medical career (demo story)"
    student:
      student_id: "p01_student"
      stage: "school"
      I_s:
        R: 0.15
        I: 0.20
        A: 0.95
        S: 0.35
        E: 0.40
        C: 0.15
      a_j:
        logical: 0.60
        numerical: 0.50
        verbal: 0.85
        spatial: 0.85
      academics:
        marks: 78.0
        subjects: ["english", "fine_arts", "design"]
        exams: []
      risk_appetite: 0.65
      domain_preference:
        design_creative: 5.0
        media_entertainment: 4.0
      relocation_willingness: 0.70
      max_years_to_income: 4.0
    family:
      savings: 80000.0
      monthly_surplus: 2500.0
      household_income: 28000.0
      existing_emis: 1500.0
      loan_max: 150000.0
      domain_ratings:
        healthcare_medicine: 5
        tech_engineering: 3
      sector_ratings:
        govt: 5
        private: 2
        entrepreneurship: 2
      min_salary: 600000.0
      max_years_to_income: 5.0
      relocation_willingness: 0.25
      risk: 0.20
    expectations:
      - rule: "top_fit_careers_contain"
        target_careers: ["ux_designer", "graphic_designer", "fine_artist"]
        min_matches: 2
        description: "Creative careers should dominate the top 5 by student fit"
      - rule: "career_not_in_top_fit"
        career_id: "doctor_mbbs"
        top_k: 5
        description: "Doctor MBBS should NOT appear in the top 5 by student fit"
      - rule: "conflict_index_level"
        expected_level: "high"
        min_value: 40.0
        description: "Conflict index should be high due to divergent domain and risk preferences"
      - rule: "conflict_dimension_driver"
        dimension: "domain"
        min_gap: 0.30
        description: "Domain divergence should be a major driver of the conflict diagnosis"
      - rule: "expensive_routes_fail_gate"
        career_id: "software_developer"
        route_id: "vit_btech_cse"
        expected_g_fin: 0
        description: "Expensive private university routes should fail the financial gate"

